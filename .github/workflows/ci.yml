# ============================================================
# 持续集成：在一块真实的 Linux 上把三种构建完整跑一遍
#
# 为什么需要它：这个仓库的改动是在 Windows 上写的，而每一处改动都要求
# "在 Linux 上真实编译并运行过"。之前靠一台内网 Ubuntu 机器远程验证，
# 那台机器与代码之间不留任何可追溯的记录；换成 CI 之后每次 push 都留下
# 一份可回溯、可复现的构建与测试记录。
#
# 为什么钉在 ubuntu-22.04：它自带 gcc 11.4.0，与各模块 README 里
# "测试与验证"一节记录的编译器版本一致。换到 24.04（gcc 13）会引入一批
# 新警告，那些已经写进文档的"0 条警告"就不再成立于同一前提之下。
# 要覆盖更新的编译器是另一件事，应当单独做、单独记录。
#
# 为什么 SKIP=mysql-client：该模块需要 libmysqlclient 头文件与一个可连的
# 数据库实例，CI 里没有；它的 check-live / check-scale 依赖真实服务器。
# 根 Makefile 的 SKIP 变量就是为这种情况准备的。
#
# 为什么报告走独立分支：GitHub 只允许带凭据读 Actions 日志，
# 而不带凭据能读的是仓库内容。把汇总写进 ci-reports 分支，
# 任何人事后都能直接读，也不必给仓库塞凭据。
# 代码分支因此不会被机器产物污染。
# ============================================================

name: ci

on:
  push:
    # ci-reports 是本工作流自己写报告用的分支，不参与构建，
    # 否则"推送报告"会再触发一次"构建 → 推送报告"。
    branches-ignore:
      - ci-reports
  pull_request:

# 同一分支上新的推送取消旧的一次，避免排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最后一步要把汇总写到 ci-reports 分支，需要写权限。
# GITHUB_TOKEN 的默认权限是只读，这里显式申请。
permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04

    env:
      SKIP: mysql-client
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=0
      UBSAN_OPTIONS: print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=0

    steps:
      - uses: actions/checkout@v4

      - name: 工具链信息
        run: |
          uname -a
          gcc --version | head -1
          make --version | head -1
          echo "nproc=$(nproc)"

      # 零警告是硬性要求。make 自己返回 0 不代表没有警告，
      # 所以每条构建命令都先把输出落到文件，再数一遍 "warning:" 的条数。
      #
      # 每个失败路径都要把日志尾部搬进汇总：Actions 的日志读出来要凭据，
      # 而这份汇总会被推到 ci-reports 分支，是唯一不依赖凭据的通道。
      # 失败时不带上下文，等于把"失败"这个事实单独留给人猜。
      - name: 默认构建（零警告）
        run: |
          # pipefail 必须有：`make | tee 日志` 的退出状态默认取管道最后一段（tee，
          # 恒为 0）。少了这一句，make 失败会被 tee 吞掉，测试挂在半路而这一步报绿。
          set -o pipefail
          rc=0
          make 2>&1 | tee /tmp/build.log || rc=$?
          n=$(grep -c 'warning:' /tmp/build.log || true)
          echo "默认构建：$n 条警告（make 退出码 $rc）" >> /tmp/ci-summary.txt
          if [ $rc -ne 0 ]; then
            { echo "!! 默认构建失败，最后 60 行："; tail -60 /tmp/build.log; } >> /tmp/ci-summary.txt
            exit $rc
          fi
          if [ "$n" -ne 0 ]; then
            { echo "!! 默认构建出现 $n 条警告："; grep 'warning:' /tmp/build.log | head -20; } >> /tmp/ci-summary.txt
            exit 1
          fi

      - name: 单元测试
        run: |
          # pipefail 必须有：`make | tee 日志` 的退出状态默认取管道最后一段（tee，
          # 恒为 0）。少了这一句，make 失败会被 tee 吞掉，测试挂在半路而这一步报绿。
          set -o pipefail
          rc=0
          make test 2>&1 | tee /tmp/test.log || rc=$?
          # 各模块的汇总行措辞不同：thread-pool 是"检查项 N，失败 M"，
          # 其余模块是"N 项检查，M 项失败"。两种都要抓，否则报告里只剩模块名。
          grep -E '^==> |项检查|检查项|项比对' /tmp/test.log >> /tmp/ci-summary.txt || true
          if [ $rc -ne 0 ]; then
            { echo "!! 单元测试失败，最后 80 行："; tail -80 /tmp/test.log; } >> /tmp/ci-summary.txt
            exit $rc
          fi

      - name: 命令行端到端检查
        run: |
          # pipefail 必须有：`make | tee 日志` 的退出状态默认取管道最后一段（tee，
          # 恒为 0）。少了这一句，make 失败会被 tee 吞掉，测试挂在半路而这一步报绿。
          set -o pipefail
          rc=0
          make check 2>&1 | tee /tmp/check.log || rc=$?
          grep -E '^==> |项检查|检查项|项比对' /tmp/check.log >> /tmp/ci-summary.txt || true
          if [ $rc -ne 0 ]; then
            { echo "!! 命令行检查失败，最后 80 行："; tail -80 /tmp/check.log; } >> /tmp/ci-summary.txt
            exit $rc
          fi

      - name: ASan + UBSan
        run: |
          # pipefail 必须有：`make | tee 日志` 的退出状态默认取管道最后一段（tee，
          # 恒为 0）。少了这一句，make 失败会被 tee 吞掉，测试挂在半路而这一步报绿。
          set -o pipefail
          rc=0
          make sanitize 2>&1 | tee /tmp/sanitize.log || rc=$?
          n=$(grep -c 'warning:' /tmp/sanitize.log || true)
          echo "ASan+UBSan：$n 条警告（make 退出码 $rc）" >> /tmp/ci-summary.txt
          grep -E '^==> |项检查|检查项|项比对|项全过' /tmp/sanitize.log >> /tmp/ci-summary.txt || true
          if [ $rc -ne 0 ] || grep -qE 'ERROR: (Address|Leak)Sanitizer|runtime error:' /tmp/sanitize.log; then
            { echo "!! sanitizer 失败或报错，最后 80 行："; tail -80 /tmp/sanitize.log; } >> /tmp/ci-summary.txt
            exit 1
          fi
          if [ "$n" -ne 0 ]; then
            { echo "!! sanitizer 构建出现 $n 条警告"; grep 'warning:' /tmp/sanitize.log | head -20; } >> /tmp/ci-summary.txt
            exit 1
          fi

      - name: ThreadSanitizer
        run: |
          # pipefail 必须有：`make | tee 日志` 的退出状态默认取管道最后一段（tee，
          # 恒为 0）。少了这一句，make 失败会被 tee 吞掉，测试挂在半路而这一步报绿。
          set -o pipefail
          rc=0
          make tsan 2>&1 | tee /tmp/tsan.log || rc=$?
          n=$(grep -c 'warning:' /tmp/tsan.log || true)
          echo "TSan：$n 条警告（make 退出码 $rc）" >> /tmp/ci-summary.txt
          grep -E '^==> |项检查|检查项|项比对|项全过' /tmp/tsan.log >> /tmp/ci-summary.txt || true
          if [ $rc -ne 0 ] || grep -q 'WARNING: ThreadSanitizer' /tmp/tsan.log; then
            { echo "!! TSan 失败或报 data race，最后 80 行："; tail -80 /tmp/tsan.log; } >> /tmp/ci-summary.txt
            exit 1
          fi
          if [ "$n" -ne 0 ]; then
            { echo "!! TSan 构建出现 $n 条警告"; grep 'warning:' /tmp/tsan.log | head -20; } >> /tmp/ci-summary.txt
            exit 1
          fi

      - name: 基准
        run: |
          # pipefail 必须有：`make | tee 日志` 的退出状态默认取管道最后一段（tee，
          # 恒为 0）。少了这一句，make 失败会被 tee 吞掉，测试挂在半路而这一步报绿。
          set -o pipefail
          rc=0
          make bench 2>&1 | tee /tmp/bench.log || rc=$?
          if [ $rc -ne 0 ]; then
            { echo "!! 基准失败，最后 40 行："; tail -40 /tmp/bench.log; } >> /tmp/ci-summary.txt
            exit $rc
          fi

      # 放在最后：它要先 make clean，否则共用 bin/ 时 make 只比时间戳、
      # 认为目标已是最新，一套新选项根本不会生效。
      #
      # -Wcast-qual 是唯一不参与判定的旗标，单独计数并写进报告：
      # 各模块的 const 查询函数内部要给同步原语加锁，而 pthread_mutex_lock
      # 的形参是非 const 的 pthread_mutex_t *，实现里因此对锁成员取了
      # 非 const 视图。按 C11 6.7.3p6，只要对象本身不是 const 限定的，
      # 通过转型丢弃 const 再修改它是良定义的——counter 与 threadpool 都由
      # create 分配、调用方持有非 const 句柄，所以这不是未定义行为，
      # 只是"逻辑只读、物理上要同步"这个取舍的可见代价。
      # 真要消掉它，得把同步原语放到对象之外（C 没有 mutable），
      # 那是结构改动，记在各自 README 的待办里，不混进任何一次小改动。
      - name: 加严警告构建
        run: |
          # pipefail 必须有：`make | tee 日志` 的退出状态默认取管道最后一段（tee，
          # 恒为 0）。少了这一句，make 失败会被 tee 吞掉，测试挂在半路而这一步报绿。
          set -o pipefail
          rc=0
          make clean >/dev/null
          make \
            CFLAGS='-std=c11 -Wall -Wextra -Wconversion -Wpedantic -Wcast-qual -Wundef -Wvla -Wformat=2 -Wshadow -Wstrict-prototypes -Wmissing-prototypes -O2 -g -pthread' \
            2>&1 | tee /tmp/strict.log || rc=$?
          total=$(grep -c 'warning:' /tmp/strict.log || true)
          # 只数"告警行里的 -Wcast-qual"。不能直接 grep -c 'Wcast-qual'：
          # make 会把每条编译命令回显出来，命令行里也含这个旗标，
          # 于是统计值比告警总数还大（实测 25 > 12）。
          castq=$(grep 'warning:' /tmp/strict.log | grep -c 'Wcast-qual' || true)
          other=$((total - castq))
          echo "加严警告构建：$total 条警告，其中 -Wcast-qual $castq 条（不判定），其余 $other 条（make 退出码 $rc）" >> /tmp/ci-summary.txt
          if [ $rc -ne 0 ]; then
            { echo "!! 加严警告构建失败，最后 60 行："; tail -60 /tmp/strict.log; } >> /tmp/ci-summary.txt
            exit $rc
          fi
          if [ "$other" -ne 0 ]; then
            { echo "!! 加严警告构建出现 $other 条 -Wcast-qual 之外的警告："
              grep 'warning:' /tmp/strict.log | grep -v 'Wcast-qual' | head -20; } >> /tmp/ci-summary.txt
            exit 1
          fi

      # 无论前面成败都写报告：失败时更需要这份记录。
      - name: 汇总到 ci-reports 分支
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/report
          {
            echo "sha:      $GITHUB_SHA"
            echo "ref:      $GITHUB_REF_NAME"
            echo "run:      $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "compiler: $(gcc --version | head -1)"
            echo "result:   ${{ job.status }}"
            echo
            echo "== 步骤 =="
            cat /tmp/ci-summary.txt 2>/dev/null || echo "(无汇总)"
            echo
            echo "== 基准 =="
            # 这里必须是完整日志，不能 tail：根 Makefile 按模块顺序跑 bench，
            # 排在前面的模块（concurrent-lock、contact-list）的表格在开头，
            # tail -80 只留得住最后两个模块。2026-10-30 要用 contact-list 的新增列
            # 才发现数据被截掉了——报告"少了一段"比"没有报告"更难察觉。
            cat /tmp/bench.log 2>/dev/null || echo "(未跑)"
          } > "/tmp/report/${GITHUB_SHA}.txt"

          cd /tmp/report
          git init -q
          git config user.name  "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-reports
          git add -A
          git commit -qm "ci report ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-reports
